# Neo4j graph layer for local development (TRD §0.2). The graph is synced from SQLite by
# `make graph-sync`; ingest stays in SQLite. Ports are bound to localhost only.
name: hindsight-graph
services:
  neo4j:
    image: neo4j:5.26.32-community
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474" # Neo4j Browser: http://localhost:7474
      - "127.0.0.1:7687:7687" # Bolt
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD is not set (scripts/graph.sh sets it)}"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  neo4j-data:
