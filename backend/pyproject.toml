[project]
name = "hindsight"
version = "0.1.0"
description = "Project Brain: why was this built this way, and what will this change affect"
requires-python = ">=3.12,<3.13"
dependencies = [
  "drain3>=0.9.11",
  "fastapi>=0.162.0",
  "httpx>=0.28.1",
  "neo4j>=6.4.1",
  "networkx>=3.7",
  "playwright>=1.64.1",
  "pydantic>=2.14.2",
  "pymupdf>=2.0",
  "python-multipart>=0.0.32",
  "pyyaml>=6.0.3",
  "uvicorn>=0.54.0",
]

[project.scripts]
hindsight = "hindsight.cli:main"
hs-eval = "hindsight.eval.cli:main"

[dependency-groups]
dev = ["pytest>=9.2.0", "ruff>=0.17.3"]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hindsight"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# the formatter wraps code; long SQL strings stay on one line for readability
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-m", "not integration"]
markers = ["integration: needs network or the ingested demo data"]
